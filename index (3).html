<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GA One Stop | กลุ่มบริหารทั่วไป โรงเรียนสตรีวัดระฆัง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12306b; --navy-d:#0b2150; --navy-l:#e8edf8; --yellow:#f6c21c; --yellow-l:#fff6d6;
  --bg:#f3f5fa; --card:#fff; --ink:#1a2238; --mute:#66708a; --line:#dfe4ef;
  --ok:#1f8a4c; --ok-l:#e2f4e9; --warn:#b26a00; --warn-l:#fff0d4; --bad:#c0392b; --bad-l:#fde7e4; --info:#1d5fbf; --info-l:#e3eefc;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--bg)}
h1,h2,h3,.brand b{font-family:Prompt,Sarabun,sans-serif;margin:0;line-height:1.3}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid var(--yellow)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--yellow);color:var(--navy-d);display:grid;place-items:center;font:700 .95rem Prompt,sans-serif;flex:none}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-size:1.02rem}
.brand span{font-size:.8rem;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;flex-direction:column;font-size:.7rem;opacity:.95;max-width:46vw}
.who select{background:var(--navy-d);color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:5px 6px;font-size:.85rem;max-width:100%}
.shell{display:flex;max-width:1200px;margin:0 auto}
nav{width:220px;flex:none;padding:18px 10px;position:sticky;top:62px;align-self:flex-start}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--navy-l)}
nav a.on{background:var(--navy);color:#fff}
nav a .n{margin-left:auto;background:var(--yellow);color:var(--navy-d);font-size:.75rem;font-weight:700;border-radius:99px;padding:0 7px}
main{flex:1;min-width:0;padding:20px 16px 60px}
@media(max-width:820px){
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px;overflow-x:auto}
  nav a{flex:1;flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;min-width:58px;text-align:center;margin:0;position:relative}
  nav a .n{position:absolute;top:2px;right:8px}
  main{padding-bottom:90px}
}

/* components */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.head p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.head>div{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn.yel{background:var(--yellow);border-color:var(--yellow);color:var(--navy-d)}
.btn.sm{padding:4px 10px;font-size:.88rem;border-radius:8px}
.btn.ok{color:var(--ok)} .btn.no{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.svc{display:block;text-decoration:none;color:inherit;border-top:4px solid var(--navy);transition:.15s}
.svc:hover{transform:translateY(-2px);box-shadow:0 6px 18px #12306b22}
.svc .ic{width:42px;height:42px;border-radius:12px;background:var(--navy-l);color:var(--navy);display:grid;place-items:center;margin-bottom:8px}
.svc .ic svg{width:24px;height:24px}
.svc p{margin:2px 0 0;color:var(--mute);font-size:.88rem}
.hero{background:linear-gradient(120deg,var(--navy),#1e4696);color:#fff;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--yellow);opacity:.9}
.hero p{margin:4px 0 0;opacity:.95;max-width:75%}
.hero p.sm{font-size:.85rem;opacity:.8}
.hero>*{position:relative;z-index:1}
.hero h1{max-width:78%}
@media(max-width:820px){.hero:after{width:84px;height:84px;right:-26px;top:-26px}.hero h1,.hero p{max-width:88%}}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border-radius:99px;padding:1px 10px;white-space:nowrap}
.t-wait{background:var(--warn-l);color:var(--warn)} .t-ok{background:var(--ok-l);color:var(--ok)}
.t-bad{background:var(--bad-l);color:var(--bad)} .t-info{background:var(--info-l);color:var(--info)}
.t-gray{background:#eceff5;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:.9rem}
.id{font:600 .8rem ui-monospace,monospace;color:var(--navy);background:var(--navy-l);border-radius:6px;padding:1px 6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* progress steps */
.steps{display:flex;margin:12px 0 4px}
.steps div{flex:1;text-align:center;font-size:.76rem;color:var(--mute);position:relative;padding-top:20px}
.steps div:before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#cfd6e4;z-index:1}
.steps div:after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#cfd6e4}
.steps div:first-child:after{display:none}
.steps .done{color:var(--ink);font-weight:600}
.steps .done:before,.steps .done:after{background:var(--navy)}
.steps .now:before{background:var(--yellow);box-shadow:0 0 0 3px var(--navy)}
.etabox{background:var(--yellow-l);border-radius:10px;padding:8px 12px;font-size:.92rem;margin-top:8px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:.75rem;color:var(--mute);padding:2px 0}
.cal button{border:1px solid transparent;background:#f6f8fc;border-radius:8px;padding:5px 0 3px;cursor:pointer;min-height:44px}
.cal button.today{border-color:var(--yellow);background:var(--yellow-l)}
.cal button.sel{background:var(--navy);color:#fff}
.cal .dots{display:flex;justify-content:center;gap:2px;height:7px;margin-top:1px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.slot{border-left:4px solid var(--navy);padding:6px 10px;background:#f6f8fc;border-radius:0 8px 8px 0;margin-bottom:6px;font-size:.93rem}

/* forms / modal */
.modal{position:fixed;inset:0;background:#0b215099;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:18px}
.sheet h2{margin-bottom:10px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid #c9d0de;border-radius:9px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:1px;border-color:var(--navy)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{margin:0;font-weight:500;border:1px solid #c9d0de;border-radius:99px;padding:4px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chk label:has(input:checked){background:var(--navy-l);border-color:var(--navy)}
fieldset{border:1px solid var(--line);border-radius:12px;margin:12px 0 0;padding:4px 12px 12px}
legend{font:600 .92rem Prompt,sans-serif;color:var(--navy);padding:0 6px}
.msg{border-radius:9px;padding:7px 10px;font-size:.9rem;margin-top:8px}
.msg.ok{background:var(--ok-l);color:var(--ok)} .msg.bad{background:var(--bad-l);color:var(--bad)} .msg.info{background:var(--info-l);color:var(--info)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy-d);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* dashboard */
.kpi b{display:block;font:700 1.9rem Prompt,sans-serif;color:var(--navy);line-height:1.1}
.kpi span{color:var(--mute);font-size:.88rem}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 34px;gap:8px;align-items:center;font-size:.9rem;margin:7px 0}
.bar div{height:12px;border-radius:99px;background:#e9edf5;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar b{text-align:right}
.demo{font-size:.82rem;color:var(--mute);text-align:center;margin-top:24px}
.demo button{background:none;border:0;color:var(--info);text-decoration:underline;cursor:pointer;font-size:inherit}
</style>
</head>
<body>
<header class="top">
  <div class="logo">GA</div>
  <div class="brand"><b>GA One Stop</b><span>กลุ่มบริหารทั่วไป โรงเรียนสตรีวัดระฆัง</span></div>
  <label class="who" style="margin:0;font-weight:400">ทดลองใช้ในบทบาท
    <select id="who" onchange="setUser(this.value)" aria-label="เลือกผู้ใช้สำหรับทดลอง"></select>
  </label>
</header>
<div class="shell">
  <nav id="nav" aria-label="เมนูหลัก"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   GA One Stop : ต้นแบบ (Prototype)
   ข้อมูลทั้งหมดเก็บใน localStorage ของเบราว์เซอร์เครื่องนี้เท่านั้น
   เมื่อใช้งานจริงให้เปลี่ยนฟังก์ชัน load()/save() ไปเรียก Google Apps Script
   ============================================================ */
const KEY='ga-one-stop-v3';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=day(0);
const thDate=s=>s?new Date(s.slice(0,10)+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'-';
const thLong=s=>new Date(s+'T00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const thDT=s=>thDate(s)+' '+s.slice(11,16)+' น.';

const ICON={
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  repair:'<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.8 2.8-2.2-2.2z"/>',
  room:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  van:'<path d="M2 16V7h12l5 4h3v5h-2M2 16h3m4 0h7"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/>',
  doc:'<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>',
  dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  mine:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', clip:'<path d="M20 11l-8.5 8.5a5 5 0 01-7-7L13 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L14 7"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- ข้อมูลหลัก (แก้ให้ตรงกับโรงเรียนได้ที่นี่) ---------- */
const DEPTS=['ภาษาไทย','ภาษาต่างประเทศ','คณิตศาสตร์','วิทยาศาสตร์และเทคโนโลยี','การงานอาชีพ','ศิลปะ','สุขศึกษาและพลศึกษา','สังคมศึกษา','กิจกรรมพัฒนาผู้เรียน']; // 8 กลุ่มสาระฯ + 1 กิจกรรม (กลุ่มบริหารวิชาการ)
const deptName=d=>d==='กิจกรรมพัฒนาผู้เรียน'?'กลุ่มกิจกรรมพัฒนาผู้เรียน':'กลุ่มสาระฯ '+d;
const USERS=[ // ชื่อ-สกุลสมมติทั้งหมด
  {id:'u1',name:'ครูสมใจ รักเรียน',dept:'ภาษาไทย',role:'teacher'},
  {id:'u2',name:'ครูวิชัย ใจดี',dept:'วิทยาศาสตร์และเทคโนโลยี',role:'teacher'},
  {id:'u3',name:'ครูมาลี ศรีสุข',dept:'คณิตศาสตร์',role:'teacher'},
  {id:'u4',name:'ครูอารี มีสุข',dept:'ภาษาต่างประเทศ',role:'teacher'},
  {id:'u5',name:'ครูธนา พัฒนกิจ',dept:'กิจกรรมพัฒนาผู้เรียน',role:'teacher'},
  {id:'s1',name:'คุณนภา แสงทอง',nick:'คุณนภา',pos:'เจ้าหน้าที่กลุ่มบริหารทั่วไป',role:'staff'},
  {id:'d1',name:'นายสมชาย ใจมั่น',nick:'ท่านรองฯ สมชาย',pos:'รองผู้อำนวยการกลุ่มบริหารทั่วไป',role:'dep_ga'},
  {id:'d2',name:'นางวันเพ็ญ ศรีวิชา',nick:'ท่านรองฯ วันเพ็ญ',pos:'รองผู้อำนวยการกลุ่มบริหารวิชาการ',role:'dep',group:'กลุ่มบริหารวิชาการ'}
];
USERS.forEach(u=>{if(u.dept)u.pos='ครู '+deptName(u.dept)});
const ROOMS={
  yon:{name:'ห้องประชุมยลนที',cap:{chair:200,floor:300},color:'#12306b',note:'นั่งเก้าอี้ 150–200 คน / นั่งพื้น 300 คน'},
  sar:{name:'ห้องประชุมสราญชล',cap:{chair:35,floor:35},color:'#e0a800',note:'ห้องขนาดกลาง 35 คน'}
};
const VANS={
  1:{name:'รถตู้คันที่ 1',plate:'ฮภ 1195',seat:11,color:'#12306b'},
  2:{name:'รถตู้คันที่ 2',plate:'1นฉ 8965',seat:11,color:'#e0a800'},
  3:{name:'รถตู้ผู้บริหาร',plate:'ฮจ 8735',seat:6,color:'#1f8a4c',exec:true} // ครูใช้ได้เมื่อจำเป็นจริง ๆ
};
const VAN_LEAD=3, AV_LEAD=1; // จำนวนวันที่ต้องแจ้งล่วงหน้า
const AV=['ไมโครโฟนไร้สาย','ไมโครโฟนตั้งโต๊ะ','เครื่องเสียง','โปรเจกเตอร์','โทรทัศน์','โน้ตบุ๊กประชุมออนไลน์','ช่างภาพ'];
const GROUPS=['กลุ่มบริหารวิชาการ','กลุ่มบริหารงบประมาณ','กลุ่มบริหารงานบุคคล','กลุ่มบริหารทั่วไป'];
const RSTAT=['รอรับเรื่อง','มอบหมายช่างแล้ว','กำลังซ่อม','รออะไหล่','ซ่อมเสร็จ'];
const RCAT={it:'อุปกรณ์เทคโนโลยี',bld:'อาคารสถานที่/วัสดุ'};
const DSTAGE=['รอรองฯ บริหารทั่วไปพิจารณา','รอกลุ่มบริหารมอบหมายผู้รับผิดชอบ','ส่งถึงครูผู้เกี่ยวข้องแล้ว'];

/* ---------- ที่เก็บข้อมูล ---------- */
let DB, me, cal={ym:TODAY.slice(0,7),sel:TODAY}, tab={};
function seed(){
  return {seq:{R:6,E:5,V:6,D:6,M:5},
  minutes:[
    {id:'M-0001',no:'1/2569',date:'2026-02-21',title:'ประชุมครูและบุคลากร',summary:'เตรียมการสอบปลายภาค การส่งผลการเรียน และกำหนดการปิดภาคเรียน',file:'รายงานการประชุม_1-2569.pdf',read:{u1:'2026-02-23',u2:'2026-02-23',u3:'2026-02-24',u4:'2026-02-25',u5:'2026-03-02'},created:'2026-02-22'},
    {id:'M-0002',no:'2/2569',date:'2026-04-01',title:'ประชุมครูและบุคลากร',summary:'สรุปผลการดำเนินงานปีการศึกษาที่ผ่านมา และแผนการรับนักเรียนใหม่',file:'รายงานการประชุม_2-2569.pdf',read:{u1:'2026-04-02',u2:'2026-04-03',u3:'2026-04-03',u5:'2026-04-10'},created:'2026-04-02'},
    {id:'M-0003',no:'3/2569',date:'2026-09-04',title:'ประชุมครูและบุคลากร',summary:'การสอบกลางภาค กิจกรรมวันสำคัญ และมาตรการความปลอดภัยในโรงเรียน',file:'รายงานการประชุม_3-2569.pdf',read:{u2:'2026-09-07',u3:'2026-09-08'},created:'2026-09-05'},
    {id:'M-0004',no:'4/2569',date:day(-8),title:'ประชุมครูและบุคลากร',summary:'การเปิดภาคเรียนที่ 2 ปฏิทินงานวิชาการ และการใช้ระบบ GA One Stop',file:'รายงานการประชุม_4-2569.pdf',read:{u3:day(-6)},created:day(-7)}

function calendar(dotsFn){
  const [y,m]=cal.ym.split('-').map(Number), first=new Date(y,m-1,1), n=new Date(y,m,0).getDate();
  let h=`<div class="row sp" style="margin-bottom:8px"><button class="btn sm" onclick="calMove(-1)" aria-label="เดือนก่อนหน้า">‹</button><h3>${first.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</h3><button class="btn sm" onclick="calMove(1)" aria-label="เดือนถัดไป">›</button></div><div class="cal">`;
  h+=['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(first.getDay());
  for(let d=1;d<=n;d++){const ds=`${cal.ym}-${pad(d)}`;
    h+=`<button class="${ds===TODAY?'today ':''}${ds===cal.sel?'sel':''}" onclick="cal.sel='${ds}';render()">${d}<span class="dots">${dotsFn(ds).map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`}
  return h+'</div>';
}

function repairCard(r){

    <div class="card kpi"><b>${open}</b><span>งานซ่อมที่ยังค้าง</span></div>
    <div class="card kpi"><b>${avg}</b><span>วัน · เวลาซ่อมเฉลี่ย</span></div>
    <div class="card kpi"><b>${ev.length}</b><span>การจองห้องประชุมเดือนนี้</span></div>
    <div class="card kpi"><b>${vn.length}</b><span>เที่ยวรถเดือนนี้</span></div>
    <div class="card kpi"><b>${tot?Math.round(rd/tot*100):0}%</b><span>อัตราการเปิดอ่านหนังสือ</span></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="card"><h2>งานซ่อมตามสถานะ</h2>${RSTAT.map((s,i)=>bar(s,rs[i],mx(rs))).join('')}</div>
    <div class="card"><h2>งานซ่อมตามประเภท</h2>${Object.entries(RCAT).map(([k,l])=>bar(l,R.filter(x=>x.cat===k).length,R.length)).join('')}</div>
    <div class="card"><h2>การใช้ห้องประชุมเดือนนี้</h2>${Object.values(ROOMS).map((r,i)=>bar(r.name,er[i],mx(er))).join('')}</div>
    <div class="card"><h2>การใช้รถตู้เดือนนี้</h2>${Object.values(VANS).map((v,i)=>bar(v.name,vr[i],mx(vr))).join('')}</div>
    <div class="card"><h2>อุปกรณ์โสตฯ ที่ถูกขอใช้</h2>${AV.map((a,i)=>bar(a,avc[i],mx(avc))).join('')}</div>
    <div class="card"><h2>หนังสือราชการ</h2>${DSTAGE.map((s,i)=>bar(s,DB.docs.filter(d=>d.stage===i).length,DB.docs.length)).join('')}
      <p class="mute" style="margin:8px 0 0">มีการส่งหนังสือถึงครูแล้ว ${tot} ครั้ง เปิดอ่านแล้ว ${rd} ครั้ง ยังไม่เปิดอ่าน ${tot-rd} ครั้ง</p></div>
    <div class="card"><h2>การเปิดอ่านรายงานการประชุม</h2>${[...DB.minutes].sort((a,b)=>a.date.localeCompare(b.date)).map(m=>bar(`ครั้งที่ ${esc(m.no)} (${thDate(m.date)})`,TEACHERS().filter(u=>m.read[u.id]).length,TEACHERS().length)).join('')}
      <p class="mute" style="margin:8px 0 0">จำนวนครูที่เปิดอ่าน จากครูทั้งหมด ${TEACHERS().length} คน</p></div>
  </div>`;
}

/* ---------- เริ่มทำงาน ---------- */
load();
let saved=null;try{saved=localStorage.getItem(KEY+'-me')}catch(e){}
me=USERS.find(u=>u.id===saved)||USERS[0];
$('#who').innerHTML=USERS.map(u=>`<option value="${u.id}" ${u.id===me.id?'selected':''}>${u.name} (${u.role==='teacher'?'ครู':u.role==='staff'?'เจ้าหน้าที่':u.role==='dep_ga'?'รองฯ บริหารทั่วไป':'รองฯ วิชาการ'})</option>`).join('');
render();
</script>
</body>
</html>
